<!DOCTYPE html>
<html>
  <head>
    <title>New WDPD homepage</title>
	<style>
	body {
		background-color: #E2D8B7;
		/* Removes browser default margins */
		margin: 0;
		text-align: center;
    }
	h1 {
		color: white;
		text-align: center;
	}
	p {
		color: white;
		text-align: center;
	}
	.textWrap {
		background-color: #708090d0;
		padding: 5px 16px;
	}
	.button-link {
		display: inline-block;
		padding: 15px 20px;
		background-color: #708090d0;
		color: white;
		text-decoration: none; /* Removes the underline */
		border-radius: 5px;
		text-align: center;
	}

	.button-link:hover {
		background-color: #AF6F00; /* Darkens on hover */
	}
	</style>
  </head>
  <body>
    <div>
        <h1><span class="textWrap">Waterdeep Times-Herald Articles</span></h1>
		<p><span class="textWrap" id="date"></span></p>
        <a href="https://docs.google.com/document/d/1RUKsJQ0i-xvSNo1IbnaRlL0ZW_ez9RtUTCczSzoc0yM/edit?usp=drive_link" class="button-link">9 Marpenoth 1576 Front Page </a><br><br>
		<a href="https://docs.google.com/document/d/1FHlVwi8GDSVVcI8Cxe8klag0EFnMzzQ7YSDl7y2bnVo/edit?usp=drive_link" class="button-link">23 Marpenoth 1576 Front Page</a><br><br>
		<a href="https://docs.google.com/document/d/1fOlWiaVL7FNuMqg7gmqiwUJX3RzPg8NtEUH5ZTYYDoU/edit?usp=drive_link" class="button-link">7 Uktar 1576 Front Page</a><br><br>
    </div>
  </body>
  <script>
	const date = new Date();
	const harptosYear = date.getFullYear() - 450;
	const isLeapYear = (date.getFullYear() % 4 === 0);
	let monthNum = date.getMonth() + 1;
	let dayNum = date.getDate();
	let harptosMonth = "";
	if (isLeapYear == false) {
		if (monthNum == 4 || monthNum == 6 || monthNum == 7 || monthNum == 8 || monthNum == 10 || monthNum == 12) {
			dayNum = dayNum - 1;
			if (dayNum < 1) {
				if (monthNum == 4 || monthNum == 6 || monthNum == 7) {
					dayNum = 30;
				} else if (monthNum == 9 || monthNum == 10 || monthNum == 12) {
					dayNum = 31;
				}
				monthNum = monthNum - 1;
			}
		} else if (monthNum == 3 || monthNum == 5) {
			dayNum = dayNum - 2;
			if (dayNum < 1) {
				if (monthNum == 3) {
					dayNum = dayNum + 30;
				} else {
					dayNum = dayNum + 31;
				}
			monthNum = monthNum - 1;
			}
		}
	}
	if (monthNum == 1) {
		harptosMonth = "Hammer";
	} else if (monthNum == 2) {
		harptosMonth = "Alturiak";
	} else if (monthNum == 3) {
		harptosMonth = "Ches";
	} else if (monthNum == 4) {
		harptosMonth = "Tarsakh";
	} else if (monthNum == 5) {
		harptosMonth = "Mirtul";
	} else if (monthNum == 6) {
		harptosMonth = "Kythorn";
	} else if (monthNum == 7) {
		harptosMonth = "Flamerule";
	} else if (monthNum == 8) {
		harptosMonth = "Eleasis";
	} else if (monthNum == 9) {
		harptosMonth = "Eleint";
	} else if (monthNum == 10) {
		harptosMonth = "Marpenoth";
	} else if (monthNum == 11) {
		harptosMonth = "Uktar";
	} else if (monthNum == 12) {
		harptosMonth = "Nightal";
	}
	document.getElementById("date").innerHTML = dayNum + " " + harptosMonth + ", " + harptosYear;
  </script>
</html>
